<title>Canister Volvelle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one big card wheel (rotating name disc under a fixed teal cover with a slot window), controls beside it, stacking on phones */
:root {
  --bg: #e9efed;
  --disc: #fbfdfc;
  --disc-edge: #c9d6d2;
  --ink: #17302c;
  --ink-soft: #5d7470;
  --cover: #1f4d47;
  --cover-ink: #e3f1ed;
  --cover-soft: #9fc3bb;
  --slot: #ffffff;
  --accent: #d9861c;
  --accent-ink: #ffffff;
  --hair: #d6e0dd;
  --panel: #f7faf9;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1615; --disc: #1a2422; --disc-edge: #2c3a37; --ink: #dce9e5; --ink-soft: #8ea5a0;
    --cover: #123a35; --cover-ink: #e3f1ed; --cover-soft: #86b3a9; --slot: #f3f8f6;
    --accent: #eea13e; --accent-ink: #1a1206; --hair: #26332f; --panel: #141e1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1615; --disc: #1a2422; --disc-edge: #2c3a37; --ink: #dce9e5; --ink-soft: #8ea5a0;
  --cover: #123a35; --cover-ink: #e3f1ed; --cover-soft: #86b3a9; --slot: #f3f8f6;
  --accent: #eea13e; --accent-ink: #1a1206; --hair: #26332f; --panel: #141e1c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.wheel-box { min-width: 0; }
svg#wheel { width: 100%; max-width: 860px; height: auto; display: block; margin: 0 auto; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
svg#wheel.dragging { cursor: grabbing; }
svg#wheel:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 50%; }
.name { font-family: var(--display); font-weight: 500; font-size: 10.5px; fill: var(--ink); }
.name.on { fill: var(--accent); font-weight: 700; }
.letter { font-family: var(--display); font-weight: 700; font-size: 15px; fill: var(--ink-soft); }
aside { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.sub { color: var(--ink-soft); margin: 6px 0 0; line-height: 1.45; }
label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 600; display: block; margin-bottom: 6px; }
input#find { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--disc-edge); border-radius: 8px; background: var(--disc); color: var(--ink); }
input#find:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { font-size: 13px; color: var(--ink-soft); margin-top: 6px; min-height: 1.2em; }
.steps { display: flex; gap: 8px; }
.steps button { flex: 1; font: inherit; font-weight: 600; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--disc-edge); background: var(--disc); color: var(--ink); cursor: pointer; }
.steps button:hover { border-color: var(--accent); }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.readout { background: var(--panel); border: 1px solid var(--hair); border-radius: 10px; padding: 14px 16px; }
.readout h2 { font-family: var(--display); font-size: 26px; font-weight: 700; margin: 0 0 8px; line-height: 1.05; }
.readout table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.readout th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 600; text-align: left; padding: 0 0 4px; }
.readout td { padding: 6px 0; border-top: 1px solid var(--hair); vertical-align: top; }
.readout td .f { display: block; color: var(--ink-soft); font-size: 12.5px; }
.readout .n { text-align: right; padding-left: 10px; }
.readout .c { text-align: right; padding-left: 10px; }
.can { display: inline-block; min-width: 46px; text-align: center; font-family: var(--mono); font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 8px; }
tr.hit td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.foot { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; }
}
</style>

<div class="wrap">
  <div class="wheel-box">
    <svg id="wheel" viewBox="0 0 1000 1000" tabindex="0" role="slider" aria-label="Medicine wheel. Use arrow keys to turn." aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <defs>
        <filter id="lift" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".28"/></filter>

      <!-- rotating base disc -->
      <g id="rot">
        <circle cx="500" cy="500" r="496" fill="var(--disc)" stroke="var(--disc-edge)" stroke-width="2"/>
        <circle cx="500" cy="500" r="472" fill="none" stroke="var(--hair)" stroke-width="1"/>
        <g id="ticks"></g>
        <g id="names"></g>
      </g>
      <!-- fixed reading cursor over the rim -->
      <path d="M492 4 L508 4 L508 222 L492 222 Z" fill="var(--accent)" opacity=".13"/>
      <path d="M486 0 L514 0 L500 16 Z" fill="var(--accent)"/>
      <!-- fixed cover disc with slot -->
      <path id="cover" fill="var(--cover)" fill-rule="evenodd" filter="url(#lift)" d=""/>
      <circle cx="500" cy="500" r="290" fill="none" stroke="var(--cover-soft)" stroke-width="1" stroke-dasharray="2 5" opacity=".6"/>
      <g id="slotContent"></g>
      <text x="500" y="590" text-anchor="middle" id="bigName" style="font-family:var(--display);font-weight:700;font-size:34px;fill:var(--cover-ink)"></text>
      <text x="500" y="620" text-anchor="middle" id="bigCount" style="font-family:var(--body);font-size:15px;fill:var(--cover-soft);letter-spacing:.08em"></text>
      <text x="500" y="690" text-anchor="middle" style="font-family:var(--display);font-weight:600;font-size:17px;fill:var(--cover-soft);letter-spacing:.22em">CANISTER FINDER</text>
      <text x="500" y="712" text-anchor="middle" style="font-family:var(--body);font-size:12.5px;fill:var(--cover-soft)">turn the rim · read through the window</text>
      <!-- rivet -->
      <circle cx="500" cy="500" r="15" fill="var(--accent)"/>
      <circle cx="500" cy="500" r="6" fill="var(--cover)"/>
    </svg>
  </div>

  <aside>
    <div>
      <h1>Canister Finder</h1>
      <p class="sub">Drag the rim, scroll, or use the arrow keys. The medicine under the amber pointer shows its strengths and canister numbers in the window.</p>
    </div>
    <div>
      <label for="find">Find a medicine or canister no.</label>
      <input id="find" type="text" autocomplete="off" list="drugList" placeholder="e.g. Sertraline or 272">
      <datalist id="drugList"></datalist>
      <div class="hint" id="hint"></div>
    </div>
    <div class="steps">
      <button type="button" id="prev">◀ Previous</button>
      <button type="button" id="next">Next ▶</button>
    </div>
    <div class="readout" id="readout"></div>
    <p class="foot" id="foot"></p>
  </aside>
</div>

/* slot background sits under cover: add to rotating layer visually but static content */
const slotBg = el("rect", { x: SX0, y: SY0, width: SX1 - SX0, height: SY1 - SY0, fill: "var(--slot)" });
$("rot").after(slotBg);

const slotG = $("slotContent");
let theta = 0, current = -1, hitCan = null;

function idxFromTheta(th) { return ((Math.round(-th / STEP) % N) + N) % N; }

function render(i) {
  if (i === current && hitCan === renderedHit) return;
  current = i; renderedHit = hitCan;
  const d = DATA[i];
  nameEls.forEach((t, k) => t.classList.toggle("on", k === i));
  slotG.replaceChildren();
  const rows = d.v.length;
  const avail = SY1 - SY0 - 34;
  const rowH = Math.min(46, avail / rows);
  const top = SY0 + 28 + (avail - rowH * rows) / 2;
  /* columns: strength + form | pack | PPM | canister */
  const XS = SX0 + 12, XP = SX0 + 196, XM = SX0 + 252, XC = SX1 - 36;
  const head = "font-family:var(--body);font-size:10.5px;letter-spacing:.1em;fill:#5d7470;font-weight:600";
  slotG.appendChild(el("text", { x: XS, y: SY0 + 18, style: head }, "STRENGTH"));
  slotG.appendChild(el("text", { x: XP, y: SY0 + 18, "text-anchor": "end", style: head }, "PACK"));
  slotG.appendChild(el("text", { x: XM, y: SY0 + 18, "text-anchor": "end", style: head }, "PPM"));
  slotG.appendChild(el("text", { x: XC, y: SY0 + 18, "text-anchor": "middle", style: head }, "CAN"));
  const fsS = Math.min(19, rowH * 0.5), fsF = Math.min(12, rowH * 0.36), fsN = Math.min(16, rowH * 0.5), pillH = Math.min(22, rowH - 6);
  d.v.forEach((v, k) => {
    const y = top + rowH * k + rowH / 2;
    const hit = hitCan === v.c;
    if (hit) slotG.appendChild(el("rect", { x: SX0 + 4, y: y - rowH / 2 + 1, width: SX1 - SX0 - 8, height: rowH - 2, rx: 6, fill: "#f6dcb5" }));
    if (k > 0) slotG.appendChild(el("line", { x1: SX0 + 10, x2: SX1 - 10, y1: y - rowH / 2, y2: y - rowH / 2, stroke: "#dbe4e1", "stroke-width": 1 }));
    const st = el("text", { x: XS, y: y - fsF * 0.55, "dominant-baseline": "central", style: `font-family:var(--display);font-weight:700;font-size:${fsS}px;fill:#17302c` }, fmtStrength(v));
    slotG.appendChild(st); fit(st, XP - 70 - XS);
    const f = el("text", { x: XS, y: y + fsS * 0.55, "dominant-baseline": "central", style: `font-family:var(--body);font-weight:500;font-size:${fsF}px;fill:#5d7470` }, v.f);
    slotG.appendChild(f); fit(f, XP - 70 - XS);
    const num = `font-family:var(--display);font-weight:600;font-size:${fsN}px;fill:#17302c`;
    const p = el("text", { x: XP, y, "text-anchor": "end", "dominant-baseline": "central", style: num }, fmtPack(v));
    slotG.appendChild(p); fit(p, 64);
    const m = el("text", { x: XM, y, "text-anchor": "end", "dominant-baseline": "central", style: num }, fmtPPM(v));
    slotG.appendChild(m); fit(m, 50);
    slotG.appendChild(el("rect", { x: XC - 25, y: y - pillH / 2, width: 50, height: pillH, rx: pillH / 2, fill: "#d9861c" }));
    slotG.appendChild(el("text", { x: XC, y, "text-anchor": "middle", "dominant-baseline": "central", style: `font-family:var(--mono);font-weight:600;font-size:${Math.min(14, pillH * 0.64)}px;fill:#ffffff` }, String(v.c)));
  });
  $("bigName").textContent = d.n;
  $("bigCount").textContent = rows === 1 ? "1 STRENGTH" : rows + " STRENGTHS";
  const wheel = $("wheel");
  wheel.setAttribute("aria-valuenow", i);
  wheel.setAttribute("aria-valuetext", d.n + ": " + d.v.map(v => `${fmtStrength(v)} ${v.f}, pack ${fmtPack(v)}, PPM ${fmtPPM(v)}, canister ${v.c}`).join("; "));
  $("readout").innerHTML = `<h2></h2><table><thead><tr><th>Strength</th><th class="n">Pack</th><th class="n">PPM</th><th class="c">Can</th></tr></thead><tbody></tbody></table>`;
  $("readout").querySelector("h2").textContent = d.n;
  const tb = $("readout").querySelector("tbody");
  d.v.forEach(v => {
    const tr = document.createElement("tr");
    if (hitCan === v.c) tr.className = "hit";
    tr.innerHTML = `<td><strong></strong><span class="f"></span></td><td class="n"></td><td class="n"></td><td class="c"><span class="can"></span></td>`;
    tr.children[0].firstChild.textContent = fmtStrength(v);
    tr.children[0].lastChild.textContent = v.f;
    tr.children[1].innerHTML = v.k.map(k => k[0] || "–").join("<br>");
    tr.children[2].innerHTML = v.k.map(k => k[1] || "–").join("<br>");
    tr.children[3].firstChild.textContent = v.c;
    tb.appendChild(tr);
  });
}
let renderedHit = null;

function setTheta(th) {
  theta = th;
  $("rot").setAttribute("transform", `rotate(${theta} ${CX} ${CY})`);
  render(idxFromTheta(theta));
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim = null;
function spinTo(target) {
  cancelAnimationFrame(anim);
  if (reduce) { setTheta(target); return; }
  const from = theta, dist = target - from, dur = Math.min(700, 180 + Math.abs(dist) * 2.2), t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    setTheta(from + dist * e);
    if (p < 1) anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
}
function goIndex(i) {
  // nearest equivalent angle to current rotation
  let target = -i * STEP;
  target += Math.round((theta - target) / 360) * 360;
  spinTo(target);
}
function step(dir) { hitCan = null; goIndex((idxFromTheta(theta) + dir + N) % N); }
function snap() { goIndex(idxFromTheta(theta)); }

/* drag */
const wheel = $("wheel");
let drag = null;
function angleAt(ev) {
  const r = wheel.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * 1000 - CX, y = (ev.clientY - r.top) / r.height * 1000 - CY;
  return Math.atan2(y, x) * 180 / Math.PI;
}
wheel.addEventListener("pointerdown", ev => {
  cancelAnimationFrame(anim);
  drag = { last: angleAt(ev) };
  wheel.setPointerCapture(ev.pointerId);
  wheel.classList.add("dragging");
});
wheel.addEventListener("pointermove", ev => {
  if (!drag) return;
  const a = angleAt(ev);
  let d = a - drag.last;
  if (d > 180) d -= 360; if (d < -180) d += 360;
  drag.last = a;
  hitCan = null;
  setTheta(theta + d);
});
const endDrag = () => { if (!drag) return; drag = null; wheel.classList.remove("dragging"); snap(); };
wheel.addEventListener("pointerup", endDrag);
wheel.addEventListener("pointercancel", endDrag);

let wheelAcc = 0;
wheel.addEventListener("wheel", ev => {
  ev.preventDefault();
  wheelAcc += ev.deltaY;
  if (Math.abs(wheelAcc) >= 40) { step(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; }
}, { passive: false });

wheel.addEventListener("keydown", ev => {
  const k = ev.key;
  if (k === "ArrowRight" || k === "ArrowDown") step(1);
  else if (k === "ArrowLeft" || k === "ArrowUp") step(-1);
  else if (k === "PageDown") step(10);
  else if (k === "PageUp") step(-10);
  else if (k === "Home") { hitCan = null; goIndex(0); }
  else if (k === "End") { hitCan = null; goIndex(N - 1); }
  else if (/^[a-z]$/i.test(k)) { const j = DATA.findIndex(d => d.n[0].toLowerCase() === k.toLowerCase()); if (j >= 0) { hitCan = null; goIndex(j); } }
  else return;
  ev.preventDefault();
});
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);

/* search */
const dl = $("drugList");
DATA.forEach(d => { const o = document.createElement("option"); o.value = d.n; dl.appendChild(o); });
$("find").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase(), hint = $("hint");
  if (!q) { hint.textContent = ""; hitCan = null; render(current); return; }
  if (/^\d+$/.test(q)) {
    const c = +q, j = DATA.findIndex(d => d.v.some(v => v.c === c));
    if (j >= 0) { hitCan = c; renderedHit = undefined; goIndex(j); const v = DATA[j].v.find(v => v.c === c); hint.textContent = `Canister ${c} is ${DATA[j].n} ${fmtStrength(v)} ${v.f}.`; }
    else hint.textContent = `No medicine uses canister ${c}.`;
    return;
  }
  hitCan = null;
  let j = DATA.findIndex(d => d.n.toLowerCase().startsWith(q));
  if (j < 0) j = DATA.findIndex(d => d.n.toLowerCase().includes(q));
  if (j >= 0) { hint.textContent = ""; goIndex(j); }
  else hint.textContent = `Nothing on the wheel matches “${ev.target.value.trim()}”.`;
});

$("foot").textContent = `${N} medicines and ${DATA.reduce((s, d) => s + d.v.length, 0)} strengths with a numbered canister. FSP1, FSP2, MDU and blank entries are left off. Where a canister has more than one pack size on the sheet, each pack and its PPM are shown (28 / 500). Taken from the canister sheet on 16 Nov 2026, pack sizes and PPM on 18 Nov 2026; changes to the sheet won't show here until the wheel is rebuilt.`;

setTheta(0);
</script>

</body></html>
